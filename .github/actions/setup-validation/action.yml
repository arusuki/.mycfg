name: Set up configuration validation
description: Install validation tools and the Neovim version pinned in the Linux manifest
runs:
  using: composite
  steps:
    - name: Install check tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends shellcheck lua5.1 lua-check zsh
    - name: Read pinned Neovim version
      id: nvim
      shell: bash
      run: |
        version=$(sed -n 's/.*name: neovim\/neovim@//p' scripts/linux/aqua.yaml)
        [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install Neovim
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: ${{ steps.nvim.outputs.version }}
